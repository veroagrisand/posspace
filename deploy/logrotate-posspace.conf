# ============================================================
# logrotate untuk posspace — cegah disk penuh (penyebab umum 502
# karena proses Node crash saat tak bisa menulis log).
# Dipasang di /etc/logrotate.d/posspace oleh deploy/apply-nginx.sh
# atau deploy/init-server.sh.
# ============================================================
/var/log/posspace/*.log {
    daily
    rotate 7
    maxsize 50M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su deploy deploy
    dateext
    dateformat -%Y%m%d
}
