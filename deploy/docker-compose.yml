# ============================================================
# posspace — microservices via Docker Compose (alternatif VPS)
# Web:3000 (SvelteKit) + Api:3001 (Hono gateway) + Nginx:80/443
# ============================================================
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_UPSTREAM: http://api:3001
      PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
      PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      ALLOW_DEMO_MODE: "false"
      ALLOW_MOCK_PAYMENT: ${ALLOW_MOCK_PAYMENT:-false}
      ALLOW_MANUAL_ACTIVATION: ${ALLOW_MANUAL_ACTIVATION:-false}
    expose:
      - "3000"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      IPAYMU_VA: ${IPAYMU_VA:-}
      IPAYMU_API_KEY: ${IPAYMU_API_KEY:-}
      IPAYMU_BASE_URL: ${IPAYMU_BASE_URL:-https://sandbox.ipaymu.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-10}
      ALLOW_OTP_DEBUG: ${ALLOW_OTP_DEBUG:-false}
      ALLOW_MOCK_PAYMENT: ${ALLOW_MOCK_PAYMENT:-false}
      ALLOW_MANUAL_ACTIVATION: ${ALLOW_MANUAL_ACTIVATION:-false}
    expose:
      - "3001"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web
      - api

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'"

# Dockerfile.web / Dockerfile.api berada di deploy/ — lihat deploy/README.md