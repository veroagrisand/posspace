# ============================================================
# Nginx — posspace microservices (VPS Hostinger)
# Semua lalu lintas publik masuk ke web:3000; /api/* diteruskan
# oleh web ke gateway 127.0.0.1:3001 (jangan expose API ke publik).
# Kompatibel dengan nginx 1.24 (Ubuntu 22.04/24.04).
# ============================================================

# Header koneksi benar: upgrade hanya untuk WebSocket/SSE, selain itu
# "close" agar upstream (SvelteKit) tidak menahan koneksi idle.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name posspace.id www.posspace.id;   # ganti dengan domain Anda

    # Biarkan certbot memvalidasi dan memperbarui sertifikat via webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Redirect HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name posspace.id www.posspace.id;   # ganti dengan domain Anda

    # TLS — lineage certbot server ini (posspace.id-letsencrypt).
    # Untuk server baru, init-server.sh menyesuaikan path ini otomatis.
    ssl_certificate     /etc/letsencrypt/live/posspace.id-letsencrypt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posspace.id-letsencrypt/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ===== Optimasi latensi & bandwidth =====
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    keepalive_timeout 65;
    client_max_body_size 5m;

    # Aset statis SvelteKit (immutable, hash) — cache panjang
    location /_app/immutable/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /_app/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /favicon.ico {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
    }

    # /api/* dan halaman → web (BFF proxy ke gateway)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;   # hanya WebSocket/SSE yang upgrade
        proxy_buffering off;                      # polling pembayaran responsif
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        # Retry saat worker PM2 sedang reload — mencegah 502 sekilas.
        proxy_next_upstream error timeout http_502 http_504;
    }
}