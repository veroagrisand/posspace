# ============================================================
# Nginx — posspace microservices (VPS Hostinger)
# Semua lalu lintas publik masuk ke web:3000; /api/* diteruskan
# oleh web ke gateway 127.0.0.1:3001 (jangan expose API ke publik).
# ============================================================

server {
    listen 80;
    server_name posspace.id www.posspace.id;   # ganti dengan domain Anda

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name posspace.id www.posspace.id;   # ganti dengan domain Anda

    # TLS — buat dengan certbot: certbot --nginx -d posspace.id -d www.posspace.id
    ssl_certificate     /etc/letsencrypt/live/posspace.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posspace.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ===== Optimasi latensi & bandwidth =====
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    http2 on;
    keepalive_timeout 65;
    client_max_body_size 5m;

    # Aset statis SvelteKit (immutable, hash) — cache panjang
    location /_app/immutable/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /_app/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /favicon.ico {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
    }

    # /api/* dan halaman → web (BFF proxy ke gateway)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";   # SSE/WebSocket-friendly
        proxy_buffering off;                      # polling pembayaran responsif
        proxy_read_timeout 120s;
    }
}