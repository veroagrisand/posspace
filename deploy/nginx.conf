# ============================================================
# Nginx — posspace microservices (VPS Hostinger)
# Semua lalu lintas publik masuk ke web:3000; /api/* diteruskan
# oleh web ke gateway 127.0.0.1:3001 (jangan expose API ke publik).
# Kompatibel dengan nginx 1.24 (Ubuntu 22.04/24.04).
#
# Catatan arsitektur:
#  - Upstream memakai keepalive → nginx memakai ulang koneksi ke web,
#    bukan membuka TCP baru per request (menghilangkan reset & latensi).
#  - Aplikasi hanya polling (tanpa SSE/WebSocket), jadi header Connection
#    TIDAK dipaksa "close" per request (yang mematikan keepalive).
#  - proxy_next_upstream: saat salah satu worker PM2 reload/restart,
#    nginx otomatis mencoba worker lain — mencegah 502 sekilas.
# ============================================================

upstream posspace_web {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name posspace.id www.posspace.id;   # ganti dengan domain Anda

    # Biarkan certbot memvalidasi dan memperbarui sertifikat via webroot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Redirect HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name posspace.id www.posspace.id;   # ganti dengan domain Anda

    # TLS — lineage certbot server ini (posspace.id-letsencrypt).
    # Untuk server baru, init-server.sh menyesuaikan path ini otomatis.
    ssl_certificate     /etc/letsencrypt/live/posspace.id-letsencrypt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posspace.id-letsencrypt/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ===== Optimasi latensi & bandwidth =====
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    keepalive_timeout 65;
    client_max_body_size 5m;

    # Proxy ke web memakai HTTP/1.1 + keepalive upstream.
    # Header Connection dikosongkan agar koneksi reusable (bukan "close").
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Saat worker PM2 reload/restart: coba worker/request lain, jangan 502 langsung.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;

    # Aset statis SvelteKit (immutable, hash) — cache panjang
    location /_app/immutable/ {
        proxy_pass http://posspace_web;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /_app/ {
        proxy_pass http://posspace_web;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /favicon.ico {
        proxy_pass http://posspace_web;
        expires 30d;
    }

    # /api/* dan halaman → web (BFF proxy ke gateway).
    # proxy_buffering off: polling status pembayaran tetap responsif.
    location / {
        proxy_pass http://posspace_web;
        proxy_buffering off;
    }
}