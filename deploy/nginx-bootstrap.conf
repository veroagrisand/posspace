# Nginx bootstrap sebelum sertifikat Let's Encrypt tersedia.
# Konfigurasi ini hanya dipakai sementara oleh init-server.sh.

upstream posspace_web {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name posspace.id www.posspace.id;

    # Webroot untuk validasi dan renewal Let's Encrypt.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://posspace_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}